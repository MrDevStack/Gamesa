<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape Road: Missile Rush</title>
<style>
:root{--bg:#12151c;--fg:#f3f5f9;--btn:#262d3b;--btn2:#3a4660;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#f3f5f9;--btn:#262d3b;--btn2:#3a4660;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--fg:#f3f5f9;--btn:#262d3b;--btn2:#3a4660;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
canvas{display:block;width:min(100%,calc((100dvh - 110px) * .5625));height:auto;aspect-ratio:9/16;border-radius:12px;background:#1f3a2b}
#pad{display:flex;gap:8px;width:min(100%,420px)}
.b{flex:1;height:60px;border:0;border-radius:14px;background:var(--btn);color:var(--fg);font-size:19px;font-weight:700;font-family:inherit}
.b.on,.b:active{background:var(--btn2)}
#bm{flex:1.4}#bb{flex:1.4}
</style>
</head>
<body>
<div id="app">
<canvas id="c" width="360" height="640"></canvas>
<div id="pad">
<button class="b" id="bl" aria-label="Steer left">◀</button>
<button class="b" id="br" aria-label="Steer right">▶</button>
<button class="b" id="bm" aria-label="Fire missile">🚀 3</button>
<button class="b" id="bb" aria-label="Mega boost">⚡ 1</button>
</div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=360,H=640,RL=40,RR=320;
let st='menu',best=0,overT=0;
try{best=+localStorage.getItem('erbest')||0}catch(e){}
const key={l:0,r:0};
let P,cops,mis,pk,pt,spd,dist,kills,t,shake,spawnT,pkT,roadOff,boostT,ammo,charges,lives,inv,cd,msg,msgT;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){P={x:180,y:500,w:30,h:54};cops=[];mis=[];pk=[];pt=[];spd=6;dist=0;kills=0;t=0;shake=0;spawnT=40;pkT=2;roadOff=0;boostT=0;ammo=3;charges=1;lives=3;inv=0;cd=0;msg='';msgT=0}
reset();
function say(s){msg=s;msgT=1.4}
function start(){reset();st='play'}
function boom(px,py,big){const n=big?34:20;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*(big?7:5);pt.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:25+Math.random()*20,c:['#ffd24a','#ff8a2a','#ff4a2a','#fff3c4'][i%4],r:2+Math.random()*(big?5:3)})}}
function spawnCop(){
  const chase=Math.random()<.25&&dist>1500,px=RL+20+Math.random()*(RR-RL-40),py=chase?H+70:-70;
  if(cops.some(c=>Math.abs(c.x-px)<38&&Math.abs(c.y-py)<110))return;
  cops.push({x:px,y:py,w:30,h:54,ps:chase?8.5+Math.random():3+Math.random()*2,chase,fl:Math.random()*20});
}
function spawnPk(){pk.push({x:RL+24+Math.random()*(RR-RL-48),y:-30,type:Math.random()<.6?'m':'b'})}
function kill(c){c.dead=true;kills++;boom(c.x,c.y,true);shake=Math.max(shake,8)}
function fire(){
  if(st!=='play'||ammo<=0||cd>0)return;
  ammo--;cd=.35;mis.push({x:P.x,y:P.y-30});
  for(let i=0;i<6;i++)pt.push({x:P.x,y:P.y-30,vx:(Math.random()-.5)*3,vy:Math.random()*2,l:0,m:12,c:'#ffd24a',r:3});
}
function boost(){
  if(st!=='play'||charges<=0||boostT>0)return;
  charges--;boostT=3.5;say('Mega boost!');
}
function ov(a,b,p){return Math.abs(a.x-b.x)<(a.w+b.w)/2-p&&Math.abs(a.y-b.y)<(a.h+b.h)/2-p}
function updP(d){
  for(const p of pt){p.x+=p.vx*d;p.y+=(p.vy+spd*.3)*d;p.l+=d}
  pt=pt.filter(p=>p.l<p.m);
}
function upd(d){
  t+=d;const bs=boostT>0;
  const target=bs?17:6+Math.min(3,dist/6000);
  spd+=(target-spd)*.08*d;
  if(bs)boostT=Math.max(0,boostT-d/60);
  inv=Math.max(0,inv-d/60);cd=Math.max(0,cd-d/60);shake*=Math.pow(.9,d);msgT=Math.max(0,msgT-d/60);
  P.x=clamp(P.x+(key.r-key.l)*5.5*d,RL+17,RR-17);
  roadOff=(roadOff+spd*d)%80;dist+=spd*d;
  spawnT-=d;if(spawnT<=0){spawnCop();spawnT=Math.max(26,80-dist/150)*(.7+Math.random()*.6)}
  pkT-=d/60;if(pkT<=0){spawnPk();pkT=3+Math.random()*3}
  for(const c of cops){
    c.y+=(spd-c.ps)*d;c.fl+=d;
    if(c.chase)c.x+=Math.sign(P.x-c.x)*Math.min(1.8*d,Math.abs(P.x-c.x));
    else if(c.y>-40&&c.y<P.y-90)c.x+=Math.sign(P.x-c.x)*Math.min(.6*d,Math.abs(P.x-c.x));
    c.x=clamp(c.x,RL+16,RR-16);
    if(c.dead)continue;
    if(ov(c,P,3)){
      if(bs){kill(c);say('Smash!');shake=14}
      else if(inv<=0){
        c.dead=true;boom(c.x,c.y,false);boom(P.x,P.y,false);lives--;inv=1.8;shake=16;spd*=.6;
        if(lives<=0){gameOver();return}
        say('Hit!');
      }
    }
  }
  for(const m of mis){
    let tg=null,bd=1e9;
    for(const c of cops){if(c.dead||c.y>m.y)continue;const dd=Math.abs(c.x-m.x)+Math.abs(c.y-m.y);if(Math.abs(c.x-m.x)<90&&dd<bd){bd=dd;tg=c}}
    if(tg)m.x+=clamp((tg.x-m.x)*.15,-4,4)*d;
    m.y-=14*d;
    pt.push({x:m.x,y:m.y+10,vx:(Math.random()-.5),vy:1+Math.random(),l:0,m:10,c:'#ff9a3a',r:2.5});
    for(const c of cops){if(!c.dead&&Math.abs(m.x-c.x)<c.w/2+5&&Math.abs(m.y-c.y)<c.h/2+8){kill(c);m.hit=true;break}}
    if(m.y<-40)m.hit=true;
  }
  mis=mis.filter(m=>!m.hit);
  for(const q of pk){
    q.y+=spd*d;
    if(Math.hypot(q.x-P.x,q.y-P.y)<30){
      q.got=true;
      if(q.type==='m'){ammo=Math.min(9,ammo+2);say('+2 missiles')}
      else{charges=Math.min(3,charges+1);say('+1 boost')}
    }
  }
  pk=pk.filter(q=>!q.got&&q.y<H+40);
  cops=cops.filter(c=>!c.dead&&c.y<H+130&&c.y>-200);
  updP(d);
}
function gameOver(){
  st='over';overT=40;boom(P.x,P.y,true);
  const sc=score();if(sc>best){best=sc;try{localStorage.setItem('erbest',best)}catch(e){}}
}
const score=()=>Math.floor(dist/10)+kills*100;
function rr(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function car(cx,cy,w,h,body,cop,fl){
  rr(cx-w/2,cy-h/2,w,h,7,body);
  rr(cx-w/2+4,cy-h/2+12,w-8,12,3,'#1b2431');
  rr(cx-w/2+4,cy+h/2-20,w-8,9,3,'#1b2431');
  if(cop){
    x.fillStyle='#14171d';x.fillRect(cx-w/2,cy-3,w,6);
    const a=((fl/6)|0)%2;
    x.fillStyle=a?'#ff2a2a':'#3a2a2a';x.fillRect(cx-10,cy-8,10,5);
    x.fillStyle=a?'#2a2f3a':'#2a7bff';x.fillRect(cx,cy-8,10,5);
  }else{
    x.fillStyle='#fff3c4';x.fillRect(cx-w/2+3,cy-h/2+1,6,3);x.fillRect(cx+w/2-9,cy-h/2+1,6,3);
    x.fillStyle='#7a3a10';x.fillRect(cx-2,cy-h/2+4,4,h-8);
  }
}
function draw(){
  x.save();
  if(shake>.5)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  x.fillStyle='#1f3a2b';x.fillRect(-10,-10,W+20,H+20);
  for(let i=0;i<10;i++){
    const y=(i*80+roadOff)%(H+80)-40;
    x.fillStyle=i%2?'#27493a':'#2d5342';
    x.beginPath();x.arc(14+(i*7)%12,y,11+(i%3)*3,0,6.283);x.fill();
    x.beginPath();x.arc(W-14-(i*5)%12,y+30,10+(i%2)*4,0,6.283);x.fill();
  }
  x.fillStyle='#2a2d35';x.fillRect(RL,0,RR-RL,H);
  x.fillStyle='#e8e8e8';x.fillRect(RL-3,0,3,H);x.fillRect(RR,0,3,H);
  x.fillStyle='#8a8f9a';
  for(const lx of [110,180,250])for(let i=-1;i<9;i++)x.fillRect(lx-2,i*80+roadOff,4,40);
  if(boostT>0){
    x.strokeStyle='rgba(170,225,255,.55)';x.lineWidth=2;x.beginPath();
    for(let i=0;i<16;i++){const lx=RL+8+((i*53)%264),ly=(t*30+i*97)%H;x.moveTo(lx,ly);x.lineTo(lx,ly+60)}
    x.stroke();
  }
  for(const q of pk){
    x.fillStyle=q.type==='m'?'#c92a2a':'#1c6fd1';x.beginPath();x.arc(q.x,q.y,16,0,6.283);x.fill();
    x.strokeStyle='#fff';x.lineWidth=2;x.stroke();
    x.font='18px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(q.type==='m'?'🚀':'⚡',q.x,q.y+1);
  }
  for(const c of cops)car(c.x,c.y,c.w,c.h,'#e9edf3',true,c.fl);
  for(const m of mis){
    x.fillStyle='#ff9a3a';x.beginPath();x.moveTo(m.x-3,m.y+16);x.lineTo(m.x,m.y+26);x.lineTo(m.x+3,m.y+16);x.fill();
    rr(m.x-3,m.y-10,6,26,3,'#d8dde6');x.fillStyle='#e03131';x.fillRect(m.x-3,m.y-10,6,6);
  }
  if(st!=='over'&&!(inv>0&&((t/4)|0)%2)){
    if(boostT>0){x.shadowColor='#4cf';x.shadowBlur=24;
      x.fillStyle='#7fe3ff';x.beginPath();x.moveTo(P.x-9,P.y+27);x.lineTo(P.x,P.y+27+34+Math.random()*14);x.lineTo(P.x+9,P.y+27);x.fill();}
    car(P.x,P.y,P.w,P.h,'#ff9a1f',false,0);
    x.shadowBlur=0;
  }
  for(const p of pt){x.globalAlpha=1-p.l/p.m;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
  x.globalAlpha=1;
  x.restore();
  if(boostT>0){x.fillStyle='rgba(80,180,255,.08)';x.fillRect(0,0,W,H)}
  x.textBaseline='top';x.textAlign='left';x.font='bold 20px system-ui';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=4;
  x.fillText(score(),12,10);
  x.font='13px system-ui';x.fillText('Best '+best,12,34);
  x.textAlign='right';x.font='18px system-ui';x.fillText('❤️'.repeat(Math.max(0,lives)),W-10,10);
  if(boostT>0){x.shadowBlur=0;rr(W/2-70,52,140,8,4,'rgba(255,255,255,.2)');rr(W/2-70,52,140*boostT/3.5,8,4,'#5cd0ff')}
  x.shadowBlur=0;
  if(msgT>0){x.globalAlpha=Math.min(1,msgT*2);x.textAlign='center';x.textBaseline='middle';x.font='bold 30px system-ui';x.fillStyle='#ffd24a';x.fillText(msg,W/2,190);x.globalAlpha=1}
  if(st!=='play'){
    x.fillStyle='rgba(8,10,16,.68)';x.fillRect(0,0,W,H);
    x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
    if(st==='menu'){
      x.font='bold 40px system-ui';x.fillText('Escape Road',W/2,190);
      x.font='bold 26px system-ui';x.fillStyle='#ffb020';x.fillText('Missile Rush',W/2,230);
      x.font='16px system-ui';x.fillStyle='#fff';
      ['Dodge the police and survive','🚀 Missiles blast cops ahead','⚡ Mega boost smashes through','Left and right to steer'].forEach((s,i)=>x.fillText(s,W/2,310+i*30));
      x.font='bold 20px system-ui';x.fillStyle='#ffd24a';x.fillText('Tap to start',W/2,470);
    }else{
      x.font='bold 40px system-ui';x.fillText('Busted!',W/2,210);
      x.font='20px system-ui';x.fillText('Score '+score(),W/2,270);x.fillText('Cops destroyed '+kills,W/2,300);x.fillText('Best '+best,W/2,330);
      x.font='bold 20px system-ui';x.fillStyle='#ffd24a';x.fillText(overT>0?' ':'Tap to retry',W/2,400);
    }
  }
}
let last=performance.now();
function loop(n){
  const d=Math.min(2.5,(n-last)/16.667);last=n;
  if(st==='play')upd(d);
  else{roadOff=(roadOff+3*d)%80;updP(d);t+=d;shake*=.9;overT=Math.max(0,overT-d)}
  draw();
  const a='🚀 '+ammo,b='⚡ '+charges;
  if(bm.textContent!==a)bm.textContent=a;
  if(bb.textContent!==b)bb.textContent=b;
  requestAnimationFrame(loop);
}
const bl=document.getElementById('bl'),br=document.getElementById('br'),bm=document.getElementById('bm'),bb=document.getElementById('bb');
function hold(el,k){
  const on=e=>{e.preventDefault();key[k]=1;el.classList.add('on')},off=()=>{key[k]=0;el.classList.remove('on')};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,off));
}
hold(bl,'l');hold(br,'r');
bm.addEventListener('pointerdown',e=>{e.preventDefault();fire()});
bb.addEventListener('pointerdown',e=>{e.preventDefault();boost()});
cv.addEventListener('pointerdown',()=>{if(st==='menu'||(st==='over'&&overT<=0))start()});
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a')key.l=1;
  else if(k==='ArrowRight'||k==='d')key.r=1;
  else if(k===' '||k==='ArrowUp'){e.preventDefault();fire()}
  else if(k==='Shift'||k==='b'||k==='ArrowDown'){e.preventDefault();boost()}
  else if(k==='Enter'&&(st==='menu'||(st==='over'&&overT<=0)))start();
});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')key.l=0;if(k==='ArrowRight'||k==='d')key.r=0});
requestAnimationFrame(loop);
</script>
</body>
</html>
